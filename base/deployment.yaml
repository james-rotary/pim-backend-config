apiVersion: apps/v1
kind: Deployment
metadata:
  name: pim-backend-api
  namespace: pim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pim-backend-api
  template:
    metadata:
      labels:
        app: pim-backend-api
    spec:
      containers:
        - name: app
          image: pim-backend-api:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pim-backend-db-url
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
