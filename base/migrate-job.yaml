apiVersion: batch/v1
kind: Job
metadata:
  name: pim-migrate
  namespace: pim
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: pim-backend-api:PLACEHOLDER
          command:
            - /bin/sh
            - -c
            - |
              echo "Running migrations for pim-backend-api..."
              # Adjust command to your tool (Prisma / custom)
              npx prisma migrate deploy || {
                echo "Migration failed"; exit 1;
              }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pim-backend-db-url
                  key: DATABASE_URL
